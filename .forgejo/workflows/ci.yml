# Forgejo Actions variant of .github/workflows/ci.yml — tests only.
#
# Image builds are NOT done here: job containers on this runner have no docker daemon,
# so publishing is `make push` (or the GitHub workflow on a mirror, with
# DOCKERHUB_USERNAME/DOCKERHUB_TOKEN set).
#
# The job runs INSIDE python:3.13-alpine, which has no node — and `actions/checkout` is
# a JavaScript action (`node dist/index.js`), so without the first step every run dies
# with `exec: "node": executable file not found in $PATH` (exit 127), before any test.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: python:3.13-alpine
    steps:
      - name: toolchain for JS actions
        # node: the checkout action is JavaScript. git: checkout shells out to it.
        run: apk add --no-cache nodejs git
      - name: checkout
        # If the forgejo host sits behind an authenticating proxy, clone through the
        # internal URL instead so the token Basic-auth does not 401:
        #   with: { github-server-url: http://server:3000 }
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: install
        run: pip install -q -r requirements-dev.txt
      - name: tests
        run: python -m pytest -q
      - name: guard script syntax
        run: sh -n guard/docker-net-guard.sh
      - name: compose pins the current version
        # Catches the drift that hit this project twice: a release bump that updates
        # VERSION but leaves docker-compose.yml (or the README) pointing at the old tag.
        run: |
          v=$(python -c "import re;print(re.search(r'VERSION = \"([^\"]+)\"', open('ui/netguard.py').read()).group(1))")
          echo "VERSION=$v"
          grep -q "hippocampus/netguard:$v" docker-compose.yml
          grep -q "hippocampus/netguard-guard:$v" docker-compose.yml
          grep -q "hippocampus/netguard:$v" README.md
