name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: shell syntax
        run: sh -n guard/docker-net-guard.sh

  images:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build (no push on a branch)
        uses: docker/build-push-action@v6
        with:
          context: ./ui
          push: false
          tags: netguard:${{ github.sha }}
      - name: build guard (no push on a branch)
        uses: docker/build-push-action@v6
        with:
          context: ./guard
          push: false
          tags: netguard-guard:${{ github.sha }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && secrets.DOCKERHUB_USERNAME != ''
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: push UI
        uses: docker/build-push-action@v6
        with:
          context: ./ui
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/netguard:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/netguard:latest
      - name: push guard
        uses: docker/build-push-action@v6
        with:
          context: ./guard
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/netguard-guard:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/netguard-guard:latest
