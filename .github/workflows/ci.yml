name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: guard script syntax
        run: sh -n guard/docker-net-guard.sh

  build:
    # Tags and PRs only: on a private repo every mirrored main commit used to bill
    # two qemu-less image builds for no new information (the tag job re-builds anyway).
    # Add '|| github.event_name == \'workflow_dispatch\'' if you want a manual build.
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ./ui, push: false, tags: "netguard:sha" }
      - uses: docker/build-push-action@v6
        with: { context: ./guard, push: false, tags: "netguard-guard:sha" }

  publish:
    # A v* tag is a release. GHCR needs no secret (GITHUB_TOKEN); Docker Hub is pushed
    # only when DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are set — and note the `if:` below
    # is on the STEP, not the job: `secrets.*` is not readable in a job-level `if:`.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write          # ghcr.io
    env:
      # Job-level so the step `if:`s can see them; a step's own `env:` block is applied
      # after its `if:` has been evaluated.
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push UI to ghcr
        uses: docker/build-push-action@v6
        with:
          context: ./ui
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/netguard:${{ steps.tag.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/netguard:latest

      - name: push guard to ghcr
        uses: docker/build-push-action@v6
        with:
          context: ./guard
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/netguard-guard:${{ steps.tag.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/netguard-guard:latest

      - name: login to docker hub
        if: env.DOCKERHUB_TOKEN != '' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: push UI to docker hub
        if: env.DOCKERHUB_TOKEN != '' && env.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@v6
        with:
          context: ./ui
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/netguard:${{ steps.tag.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/netguard:latest

      - name: push guard to docker hub
        if: env.DOCKERHUB_TOKEN != '' && env.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@v6
        with:
          context: ./guard
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/netguard-guard:${{ steps.tag.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/netguard-guard:latest
