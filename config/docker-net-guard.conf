# docker-net-guard policy — the single source of truth for east-west isolation.
#
# This file is SHELL, sourced by the guard (its image has busybox only, no python/jq),
# so it must stay POSIX sh and contain only variable assignments. It is re-read
# whenever its md5 changes, so an edit applies within one poll and needs no restart.
#
# One policy per network, four space-separated fields:
#
#     <name> <direction> <subnet> <allowlist>
#
# direction — WHICH SIDE of the packet match the allowlist applies to:
#
#   src   Only the allowlisted containers may INITIATE traffic on this network.
#         Use when ONE app is the sole initiator reaching many targets.
#         (This is trafficjam's model: "the app allowed on this network".)
#
#   dst   Any container on the network may reach ONLY the allowlisted destinations.
#         Use when MANY untrusted initiators front a FEW privileged targets.
#
# allowlist — comma-separated, each one of:
#
#     <alias>          docker alias or container_name, re-resolved every poll
#     <alias>:<port>   ... restricted to one TCP port
#     <ip>             literal address (only when there is no alias)
#     <ip>:<port>      literal address + port
#     <ip>:*           literal address, any port
#
# SAFETY: a policy whose allowlist resolves to EMPTY is refused, and the previous
# ruleset for that chain is kept. Installing an empty allowlist would DROP every flow
# on the network, so the guard fails closed toward "leave it alone and complain".
#
# Add a new network as `observe` first (see MODES below), watch the flow table for a
# day, then flip it to enforce.
POLICIES="
edge     src 10.10.10.0/24 traefik
backend  dst 10.10.20.0/24 postgres:5432,redis:6379
"

# Per policy: <name>:enforce (the default) or <name>:observe.
#
#   enforce  conntrack RETURN, allowlist RETURN, then DROP everything else.
#   observe  identical, but LOG each would-be-dropped flow and RETURN it, so the real
#            traffic can be measured before enforcing.
#
# The observe log is read from the kernel ring buffer and published in status.json
# (the UI shows it as the flow table). It has no --limit, so a missing allowlist
# entry floods and the buffer wraps: read it within a day or two, not a week.
MODES="backend:observe"

# Seconds between re-verification passes: re-check the DOCKER-USER hook, the terminal
# rule and the allowlist, and re-resolve every alias to detect drift.
POLL_INTERVAL=60
